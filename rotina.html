<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: usa a tela inteira do celular (notch / barra inferior) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B68EE">
  <meta name="description" content="NeuroPlan: planejador de rotina pensado para neurodivergentes.">
  <title>Rotina · NeuroPlan</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="pagina-rotina">

  <!-- Ícones (sprite SVG). Uso: <svg class="icone"><use href="#i-home"/></svg> -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.7 0-3 .8-4.5 2.5C10.5 3.8 9.2 3 7.5 3A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  </svg>

  <div class="app">

    <!-- Cabeçalho (igual em todas as páginas) -->
    <header class="topo">
      <a href="hoje.html" class="topo__logo" aria-label="NeuroPlan - ir para Hoje">
        <!-- Exportar do Figma: logo horizontal (símbolo + "neuroplan") -->
        <img src="assets/logo-horizontal.svg" alt="NeuroPlan">
      </a>
      <a href="usuario.html" class="avatar avatar--pequeno" aria-label="Meu perfil">V</a>
    </header>

    <main class="conteudo">

      <section class="tela" id="tela-rotina" aria-labelledby="rotina-titulo">

        <div class="titulo-tela">
          <p class="titulo-tela__rotulo">Planejamento</p>
          <h1 class="titulo-tela__titulo titulo-tela__titulo--esquerda" id="rotina-titulo">Rotina semanal</h1>
        </div>

        <!-- Resumo por dia da semana -->
        <ul class="resumo-semana" id="resumo-semana" aria-label="Resumo da semana"></ul>


        <!-- Calendário.
             Os dias abaixo são só a estrutura da tela; o script.js vai gerar
             os dias reais conforme o mês/ano escolhidos. -->
        <div class="calendario" id="calendario">
          <div class="calendario__controles">
            <button type="button" class="calendario__seta" id="cal-anterior" aria-label="Mês anterior">
              <svg class="icone" aria-hidden="true"><use href="#i-chevron-left"/></svg>
            </button>

            <label class="visualmente-oculto" for="cal-mes">Mês</label>
            <select class="calendario__select" id="cal-mes">
              <option value="0" selected>Jan</option>
              <option value="1">Fev</option>
              <option value="2">Mar</option>
              <option value="3">Abr</option>
              <option value="4">Mai</option>
              <option value="5">Jun</option>
              <option value="6">Jul</option>
              <option value="7">Ago</option>
              <option value="8">Set</option>
              <option value="9">Out</option>
              <option value="10">Nov</option>
              <option value="11">Dez</option>
            </select>

            <label class="visualmente-oculto" for="cal-ano">Ano</label>
            <select class="calendario__select" id="cal-ano">
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
            </select>

            <button type="button" class="calendario__seta" id="cal-proximo" aria-label="Próximo mês">
              <svg class="icone" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </button>
          </div>

          <div class="calendario__grade" id="cal-grade" role="grid" aria-label="Dias do mês">
            <span class="calendario__semana" role="columnheader" aria-label="Domingo">D</span>
            <span class="calendario__semana" role="columnheader" aria-label="Segunda">S</span>
            <span class="calendario__semana" role="columnheader" aria-label="Terça">T</span>
            <span class="calendario__semana" role="columnheader" aria-label="Quarta">Q</span>
            <span class="calendario__semana" role="columnheader" aria-label="Quinta">Q</span>
            <span class="calendario__semana" role="columnheader" aria-label="Sexta">S</span>
            <span class="calendario__semana" role="columnheader" aria-label="Sábado">S</span>

            <!-- Dias (exemplo estático do Figma: janeiro, dia 1 selecionado) -->
            <span class="calendario__dia is-vazio" aria-hidden="true"></span>
            <button type="button" class="calendario__dia is-selecionado" aria-pressed="true">1</button>
            <button type="button" class="calendario__dia">2</button>
            <button type="button" class="calendario__dia">3</button>
            <button type="button" class="calendario__dia">4</button>
            <button type="button" class="calendario__dia">5</button>
            <button type="button" class="calendario__dia">6</button>
            <button type="button" class="calendario__dia">7</button>
            <button type="button" class="calendario__dia">8</button>
            <button type="button" class="calendario__dia">9</button>
            <button type="button" class="calendario__dia is-marcado">10</button>
            <button type="button" class="calendario__dia is-marcado">11</button>
            <button type="button" class="calendario__dia is-marcado">12</button>
            <button type="button" class="calendario__dia is-marcado">13</button>
            <button type="button" class="calendario__dia">14</button>
            <button type="button" class="calendario__dia">15</button>
            <button type="button" class="calendario__dia">16</button>
            <button type="button" class="calendario__dia">17</button>
            <button type="button" class="calendario__dia">18</button>
            <button type="button" class="calendario__dia">19</button>
            <button type="button" class="calendario__dia">20</button>
            <button type="button" class="calendario__dia">21</button>
            <button type="button" class="calendario__dia">22</button>
            <button type="button" class="calendario__dia">23</button>
            <button type="button" class="calendario__dia">24</button>
            <button type="button" class="calendario__dia">25</button>
            <button type="button" class="calendario__dia">26</button>
            <button type="button" class="calendario__dia">27</button>
            <button type="button" class="calendario__dia">28</button>
            <button type="button" class="calendario__dia">29</button>
            <button type="button" class="calendario__dia">30</button>
            <span class="calendario__dia is-fora" aria-hidden="true">1</span>
            <span class="calendario__dia is-fora" aria-hidden="true">2</span>
            <span class="calendario__dia is-fora" aria-hidden="true">3</span>
            <span class="calendario__dia is-fora" aria-hidden="true">4</span>
          </div>
        </div>

        <!-- Detalhe do dia selecionado -->
        <div class="dia-detalhe" aria-live="polite">
          <h2 class="dia-detalhe__titulo" id="dia-titulo">Dia 1 • Segunda-feira</h2>
          <div class="dia-detalhe__cartao">
            <p class="dia-detalhe__qtd" id="dia-qtd">2 tarefas agendadas</p>
            <p class="dia-detalhe__lista" id="dia-lista">Biologia • Matemática</p>
          </div>
          <ul class="lista-tarefas" id="dia-tarefas"></ul>
        </div>
      </section>

    </main>

    <!-- Menu inferior (igual em todas as páginas) -->
    <nav class="menu" aria-label="Navegação principal">
      <a href="hoje.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-home"/></svg>
        <span>Hoje</span>
      </a>
      <a href="rotina.html" class="menu__item is-ativo" aria-current="page">
        <svg class="icone" aria-hidden="true"><use href="#i-calendar"/></svg>
        <span>Rotina</span>
      </a>

      <!-- Botão central: abre "Nova tarefa" -->
      <a href="nova-tarefa.html" class="menu__adicionar" aria-label="Adicionar nova tarefa">
        <svg class="icone" aria-hidden="true"><use href="#i-plus"/></svg>
      </a>

      <a href="cuidados.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-heart"/></svg>
        <span>Cuidados</span>
      </a>
      <a href="usuario.html" class="menu__item">
        <svg class="icone" aria-hidden="true"><use href="#i-user"/></svg>
        <span>Usuário</span>
      </a>
    </nav>

  </div>
</body>
</html>
